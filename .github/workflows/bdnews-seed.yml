# bdnews SI: refresh dashboard data in Upstash Redis on a schedule.
# Needs repository secrets UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN
# (the REST URL and token of the bdnews-si-redis database). Optional API keys
# (NASA_FIRMS_API_KEY, FRED_API_KEY, ...) can be added as secrets with the same
# names; see SELF_HOSTING.md.
name: Seed data

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (a full run takes about an hour)
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these seeders (space-separated file names, e.g. "seed-insights.mjs seed-fire-detections.mjs"). Empty = all.'
        required: false
        default: ''

concurrency:
  group: bdnews-seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_REDIS_KV_REST_API_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_REDIS_KV_REST_API_TOKEN }}
      SEED_TIMEOUT: '300'
      # Upstream TTLs assume 5–30 min crons; this job runs every 3 h and takes
      # about an hour, so keep seeded data for at least 6 h (scripts/_seed-utils.mjs
      # floorSeedTtl). Freshness badges still use each seeder's own staleness limit.
      SEED_MIN_TTL_SECONDS: '21600'
      NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      # ACLED needs a commercial / public-sector licence (CLAUDE.md §3.1, Red).
      # Credentials reach the seeders only when the repo variable
      # LICENSED_ACLED is 'true'; otherwise ACLED stays off and GDELT is used.
      LICENSED_ACLED: ${{ vars.LICENSED_ACLED || 'false' }}
      LICENSED_ADSBFI: ${{ vars.LICENSED_ADSBFI || 'false' }}
      LICENSED_OPENSKY: ${{ vars.LICENSED_OPENSKY || 'false' }}
      ACLED_EMAIL: ${{ vars.LICENSED_ACLED == 'true' && secrets.ACLED_EMAIL || '' }}
      ACLED_PASSWORD: ${{ vars.LICENSED_ACLED == 'true' && secrets.ACLED_PASSWORD || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UCDP_ACCESS_TOKEN: ${{ secrets.UCDP_ACCESS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Claude (Anthropic API) is the main model once ANTHROPIC_API_KEY is set;
      # without the secret every seeder falls back to the upstream providers.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PRIMARY_PROVIDER: ${{ vars.LLM_PRIMARY_PROVIDER || 'anthropic' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Redis secrets
        run: |
          # Tolerate values pasted with quotes, spaces or a trailing newline
          # (for example copied straight from a .env snippet).
          clean() { printf '%s' "$1" | tr -d "\"' \r\n\t"; }
          url=$(clean "$UPSTASH_REDIS_REST_URL"); token=$(clean "$UPSTASH_REDIS_REST_TOKEN")
          url=${url#UPSTASH_REDIS_KV_REST_API_URL=}; url=${url#UPSTASH_REDIS_REST_URL=}
          token=${token#UPSTASH_REDIS_KV_REST_API_TOKEN=}; token=${token#UPSTASH_REDIS_REST_TOKEN=}
          if [ -z "$url" ] || [ -z "$token" ]; then
            echo "::error::Add UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN as repository secrets."
            exit 1
          fi
          # Accept the redis(s)://default:TOKEN@HOST:PORT connection string too:
          # the REST endpoint is https://HOST and the password is the REST token.
          case "$url" in
            redis://*|rediss://*)
              rest=${url#*://}; creds=${rest%@*}; hostport=${rest##*@}
              [ "$creds" != "$rest" ] && [ -z "$token" ] && token=${creds#*:}
              url="https://${hostport%%:*}" ;;
          esac
          case "$url" in
            https://*) ;;
            *) echo "::error::UPSTASH_REDIS_REST_URL must be the REST URL starting with https:// (got ${#url} characters that do not start with https://)."; exit 1 ;;
          esac
          echo "::add-mask::$url"
          echo "::add-mask::$token"
          echo "UPSTASH_REDIS_REST_URL=$url" >> "$GITHUB_ENV"
          echo "UPSTASH_REDIS_REST_TOKEN=$token" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Run seeders
        env:
          # Manual runs can name specific seeders; licence gates still apply.
          ONLY_SEEDERS: ${{ github.event.inputs.only || '' }}
        run: ./scripts/run-seeders.sh

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · BD Situation Intelligence</title>
    <meta name="description" content="Sign in to BD Situation Intelligence: Bangladesh and the world, live." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favico/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png" />
  </head>
  <body class="bdsi-auth">
    <header class="auth-top">
      <a class="auth-logo" id="authLogo" href="/about.html" aria-label="BD Situation Intelligence"></a>
      <span class="auth-tagline">Bangladesh and the World</span>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="authTitle">
        <h1 id="authTitle" class="auth-title">Sign in</h1>
        <p id="authSubtitle" class="auth-subtitle" hidden></p>

        <form id="authForm" class="auth-form" novalidate>
          <label class="auth-field" id="nameField" hidden>
            <span>Full name</span>
            <input id="authName" name="name" type="text" autocomplete="name" maxlength="120" />
          </label>
          <label class="auth-field" id="emailField">
            <span>Email</span>
            <input id="authEmail" name="email" type="email" autocomplete="email" required />
          </label>
          <label class="auth-field" id="passwordField">
            <span>Password</span>
            <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required />
          </label>
          <p class="auth-hint" id="passwordHint" hidden>At least 8 characters.</p>
          <p class="auth-consent" id="consentNote" hidden>
            By creating an account you agree to the <a href="/terms.html">Terms of Service</a> and
            <a href="/privacy.html">Privacy Policy</a>.
          </p>

          <button type="submit" class="auth-submit" id="authSubmit">Sign in</button>
          <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <button type="button" class="auth-link" id="forgotLink">Forgot password?</button>
          <button type="button" class="auth-link" id="switchLink">Create account</button>
          <button type="button" class="auth-link" id="backLink" hidden>Back to sign in</button>
        </div>
      </section>
    </main>

    <footer class="site-footer bdsi-footer" id="authFooter"></footer>

    <script type="module" src="/src/login-main.ts"></script>
  </body>
</html>
